<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#087f8c">
    <title>Tidak ada koneksi | CDSS Tifoid</title>
    <style>
        body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; color: #183247; background: #f3f7fa; font: 16px/1.6 Arial, sans-serif; }
        main { max-width: 460px; padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px #18324718; }
        h1 { color: #075e68; font-size: 1.5rem; }
        button { padding: 10px 16px; border: 0; border-radius: 8px; color: #fff; background: #087f8c; cursor: pointer; font: inherit; }
    </style>
</head>
<body>
    <main>
        <h1>Koneksi internet terputus</h1>
        <p>CDSS Tifoid memerlukan koneksi ke server untuk memuat data dan melakukan konsultasi. Demi menjaga privasi, data pasien tidak disimpan untuk akses offline.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
